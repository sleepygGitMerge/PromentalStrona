<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Centrum Psychiatrii oferujące diagnostykę i leczenie problemów psychicznych. Zapewniamy profesjonalną usługę medyczną w kameralnej atmosferze w Toruniu.">
    <title>PROMENTAL - Centrum Psychiatrii i Psychologii Toruń</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9', // Spokojny błękit medyczny
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        },
                        surface: '#ffffff', // Bardzo jasny szary/chłodny dla tła
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.surface');
            color: theme('colors.slate.800');
        }
        /* Subtelne cienie i przejścia */
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
    </style>
</head>
<body class="text-slate-800">

<header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-slate-100 transition-all duration-300" id="header">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">

            <!-- Logo -->
            <div class="flex-shrink-0 flex items-center">
                <a href="#" class="flex items-center gap-2">
                    <!-- Subtelna ikona medyczna/umysłu (abstrakcyjna) -->
                    <div class="w-10 h-10 bg-brand-50 rounded-lg flex items-center justify-center text-brand-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
                        </svg>
                    </div>
                    <span class="font-bold text-xl tracking-wide text-slate-900">PROMENTAL</span>
                </a>
            </div>

            <!-- Desktop Menu -->
            <nav class="hidden md:flex space-x-8">
                <a href="index.html" class="text-slate-600 hover:text-brand-600 font-medium transition-colors">Strona Główna</a>
                <a href="o-nas.html" class="text-slate-600 hover:text-brand-600 font-medium transition-colors">O Nas</a>
                <a href="specjalisci.html" class="text-slate-600 hover:text-brand-600 font-medium transition-colors">Specjaliści</a>
                <a href="cennik.html" class="text-slate-600 hover:text-brand-600 font-medium transition-colors">Cennik</a>
                <a href="kontakt.html" class="text-slate-600 hover:text-brand-600 font-medium transition-colors">Kontakt</a>
            </nav>

            <!-- Dostępność (Placeholders) & Mobile Toggle -->
            <div class="flex items-center space-x-4">
                <!-- Język -->
                <button class="p-2 text-slate-500 hover:text-brand-600 hover:bg-brand-50 rounded-full transition-colors" title="Zmień język (Wkrótce)" aria-label="Zmień język">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </button>
                <!-- Motyw -->
                <button class="p-2 text-slate-500 hover:text-brand-600 hover:bg-brand-50 rounded-full transition-colors" title="Zmień motyw (Wkrótce)" aria-label="Zmień motyw">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>

                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn" class="md:hidden p-2 text-slate-600 hover:text-brand-600 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu (ukryte domyślnie) -->
    <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-slate-100 shadow-lg">
        <div class="px-4 pt-2 pb-6 space-y-1">
            <a href="index.html" class="mobile-link block px-3 py-3 rounded-md text-base font-medium text-slate-700 hover:text-brand-600 hover:bg-brand-50">Strona Główna</a>
            <a href="o-nas.html" class="mobile-link block px-3 py-3 rounded-md text-base font-medium text-slate-700 hover:text-brand-600 hover:bg-brand-50">O Nas</a>
            <a href="specjalisci.html" class="mobile-link block px-3 py-3 rounded-md text-base font-medium text-slate-700 hover:text-brand-600 hover:bg-brand-50">Specjaliści</a>
            <a href="cennik.html" class="mobile-link block px-3 py-3 rounded-md text-base font-medium text-slate-700 hover:text-brand-600 hover:bg-brand-50">Cennik</a>
            <a href="kontakt.html" class="mobile-link block px-3 py-3 rounded-md text-base font-medium text-slate-700 hover:text-brand-600 hover:bg-brand-50">Kontakt</a>
        </div>
    </div>
</header>



<!-- Stopka -->
<footer class="fixed bottom-0 w-full bg-slate-800 text-slate-400 py-6 text-center text-xs">
    <p>&copy; 2012-2026 PROMENTAL. Wszelkie prawa zastrzeżone.</p>
</footer>

</body>
</html>
